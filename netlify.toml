[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[context.foco-checkout-sandbox]
  command = "node scripts/build-sandbox.mjs"

[functions]
  node_bundler = "esbuild"
  included_files = ["foco/compra/versiones/**/*.html"]

[[headers]]
  for = "/api/foco/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

# Keep Nilho's homepage and Foco's order ledger on the same project.
# Only the Foco hostname serves the product page at its root.
[[redirects]]
  from = "https://www.getfoco.co/*"
  to = "https://getfoco.co/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://getfoco.co/"
  to = "/foco/index.html"
  status = 200
  force = true
