[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[context.foco-checkout-sandbox]
  command = "node scripts/build-sandbox.mjs"

[functions]
  node_bundler = "esbuild"
  included_files = ["foco/compra/versiones/**/*.html"]

# Only Foco pages move. Nilho's corporate site and public legacy assets stay here.
# Explicit hosts keep the historical sandbox deployment independent.
[[redirects]]
  from = "https://nilho.co/foco"
  to = "https://getfoco.co/"
  status = 301
  force = true
[[redirects]]
  from = "https://nilho.co/foco/"
  to = "https://getfoco.co/"
  status = 301
  force = true
[[redirects]]
  from = "https://nilho.co/foco/index.html"
  to = "https://getfoco.co/"
  status = 301
  force = true
[[redirects]]
  from = "https://nilho.co/foco/privacidad/*"
  to = "https://getfoco.co/privacidad/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://nilho.co/foco/terminos/*"
  to = "https://getfoco.co/terminos/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://nilho.co/foco/soporte/*"
  to = "https://getfoco.co/soporte/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://nilho.co/foco/compra/*"
  to = "https://getfoco.co/compra/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://nilho.co/foco/pago/*"
  to = "https://getfoco.co/pago/:splat"
  status = 301
  force = true

[[headers]]
  for = "/api/foco/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "https://nilho.co/foco/comprar/*"
  to = "https://getfoco.co/comprar/"
  status = 301
  force = true
